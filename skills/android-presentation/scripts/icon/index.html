<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@font-face { font-family: Lilita; src: url(/node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 512px; height: 512px; overflow: hidden; }
#icon { position: relative; width: 512px; height: 512px; overflow: hidden; }
.bg { position: absolute; inset: 0; }
.rays { position: absolute; left: 50%; top: 40%; width: 1400px; height: 1400px; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(from 3deg, rgba(255,255,255,.22) 0 9deg, rgba(255,255,255,0) 9deg 20deg);
  -webkit-mask: radial-gradient(circle, rgba(0,0,0,.2) 0%, #000 12%, rgba(0,0,0,.5) 30%, transparent 45%); }
.glow { position: absolute; left: 50%; top: 40%; width: 420px; height: 420px; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,230,.95), rgba(255,240,180,0) 65%); }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; }
.vignette { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, transparent 55%, rgba(60,10,40,.35) 100%); pointer-events: none; }
.bg.sunset { background: linear-gradient(#ff5a8a 0%, #ff8a3d 38%, #ffcf4a 70%, #ffe9a0 100%); }
.bg.sky { background: linear-gradient(#2f7cf6 0%, #57b4ff 55%, #bfe9ff 100%); }
.bg.purple { background: linear-gradient(#5b2bd6 0%, #b04ad8 50%, #ff8ac2 100%); }
</style>
</head>
<body>
<div id="icon">
  <div class="bg" id="bg"></div>
  <div class="glow" id="glow"></div>
  <div class="rays" id="rays"></div>
  <div id="stage"></div>
  <div class="vignette"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('bg').classList.add(q.get('bg') || 'sunset');
  const cy = q.get('cy'); if (cy) for (const id of ['rays', 'glow']) document.getElementById(id).style.top = cy + '%';
</script>
<script type="module" src="./iconScene.ts"></script>
</body>
</html>
