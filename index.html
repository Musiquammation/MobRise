<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#8fd0f7">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<title>MobRise</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%232f8cff%22/%3E%3Crect x=%225%22 y=%223%22 width=%226%22 height=%2210%22 fill=%22%23fff%22/%3E%3C/svg%3E">
	<script type="module" src="/src/index.ts"></script>
</head>
<body x-data>
	<canvas></canvas>

	<header x-cloak x-show="!$store.dom.is('loading')">
		<output x-text="$store.dom.coins.toFixed(1)"></output>
	</header>

	<template x-if="$store.dom.is('loading')">
		<section id="loading" x-data="{ get p() { return $store.dom.panel } }">
			<h1>MobRise</h1>
			<progress :value="p.progress" max="1"></progress>
		</section>
	</template>

	<template x-if="$store.dom.is('main')">
		<section id="main" x-data="{ get p() { return $store.dom.panel } }" @click="$store.dom.play()">
			<h1>MobRise</h1>
			<p x-html="$t('main.level', { n: `<b>${p.levelNumber}</b>` })"></p>
			<small x-text="p.levelName"></small>
			<nav>
				<button x-text="$t('main.play')"></button>
				<button @click.stop="$store.dom.openShop()" x-text="$t('main.skins')"></button>
			</nav>
		</section>
	</template>

	<template x-if="$store.dom.is('game')">
		<section id="game" x-data="{ get p() { return $store.dom.panel } }">
			<progress :value="p.progress" max="1" x-show="p.phase === 'run'"></progress>
			<p x-show="p.phase === 'cannon'" x-html="$t('game.aim')"></p>

			<output x-show="p.bubble.visible" :style="`left:${p.bubble.x}px;top:${p.bubble.y}px`" x-text="p.count"></output>
			<template x-for="k in [p.gateKey]" :key="k">
				<mark x-show="k > 0 && p.bubble.visible" :class="p.gateDelta >= 0 ? 'up' : 'down'"
					:style="`left:${p.bubble.x}px;top:${p.bubble.y}px`"
					x-text="(p.gateDelta >= 0 ? '+' : '−') + Math.abs(p.gateDelta)"></mark>
			</template>
			<i x-show="p.aim.visible" :style="`left:${p.aim.x}px;top:${p.aim.y}px`"></i>

			<aside x-show="p.phase === 'cannon'">
				<span x-html="$t('game.shots', { n: `<b>${p.count}</b>` })"></span>
				<span x-show="p.combo > 1" x-text="'×' + p.combo"></span>
			</aside>
			<template x-for="k in [p.gainKey]" :key="k">
				<em x-show="k > 0" x-text="'+' + p.gain.toFixed(1)"></em>
			</template>

			<article x-show="p.phase === 'won'" x-transition>
				<h2 x-text="$t('game.level', { n: p.levelNumber })"></h2>
				<p>+<b x-text="p.earned.toFixed(1)"></b><small x-show="p.multiplier > 1" x-text="'×' + p.multiplier.toLocaleString(document.documentElement.lang, { maximumFractionDigits: 2 })"></small></p>
				<button @click="$store.dom.next()" x-text="$t('game.next')"></button>
			</article>
			<article x-show="p.phase === 'lost'" x-transition data-lost>
				<h2 x-text="$t('game.lost')"></h2>
				<button @click="$store.dom.retry()" x-text="$t('game.retry')"></button>
			</article>
		</section>
	</template>

	<template x-if="$store.dom.is('shop')">
		<section id="shop" x-data="{ get p() { return $store.dom.panel } }">
			<h2 x-text="$t('shop.title')"></h2>
			<ul>
				<template x-for="item in p.items" :key="item.skin.id">
					<li :aria-current="item.equipped" :data-selected="p.selected === item.skin.id"
						@click="p.selected = item.skin.id">
						<img :src="item.thumbnail" :alt="$t('skins.' + item.skin.id)">
						<h3 x-text="$t('skins.' + item.skin.id)"></h3>
						<button
							:disabled="item.equipped || (!item.owned && $store.dom.coins < item.skin.price)"
							:data-price="item.owned ? null : item.skin.price"
							@click.stop="item.owned ? $store.dom.equip(item.skin.id) : $store.dom.buy(item.skin.id)"
							x-text="item.equipped ? $t('shop.equipped') : item.owned ? $t('shop.equip') : item.skin.price"
						></button>
					</li>
				</template>
			</ul>
			<button @click="$store.dom.closeShop()" x-text="$t('shop.back')"></button>

			<div x-show="p.selectedItem" x-transition.opacity @click="p.selected = null"></div>
			<aside x-show="p.selectedItem" x-transition:enter-start="closed" x-transition:leave-end="closed">
				<template x-if="p.selectedItem">
					<div x-data="{ get item() { return p.selectedItem } }">
						<button data-close @click="p.selected = null" :aria-label="$t('shop.close')">×</button>
						<img :src="item.thumbnail" :alt="$t('skins.' + item.skin.id)">
						<h3 x-text="$t('skins.' + item.skin.id)"></h3>
						<p data-power>
							<span x-text="$t('shop.power')"></span>
							<b x-text="item.power"></b>
						</p>
						<dl>
							<template x-for="stat in item.stats" :key="stat.id">
								<div :data-stat="stat.id">
									<dt x-text="$t('shop.stats.' + stat.id)"></dt>
									<dd x-text="stat.value"></dd>
									<meter min="0" max="100" :value="stat.level"></meter>
									<small x-text="$t('shop.hints.' + stat.id)"></small>
								</div>
							</template>
						</dl>
						<button
							:disabled="item.equipped || (!item.owned && $store.dom.coins < item.skin.price)"
							:data-price="item.owned ? null : item.skin.price"
							@click="item.owned ? $store.dom.equip(item.skin.id) : $store.dom.buy(item.skin.id)"
							x-text="item.equipped ? $t('shop.equipped') : item.owned ? $t('shop.equip') : item.skin.price"
						></button>
					</div>
				</template>
			</aside>
		</section>
	</template>
</body>
</html>
